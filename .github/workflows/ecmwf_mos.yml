name: ECMWF MOS

on:
  schedule:
    # Several tries per cycle; predict exits quietly if the newest complete
    # run is already published, so extra triggers cost ~1 min each.
    - cron: "20 8,9,10 * * *"     # 00Z run
    - cron: "20 20,21,22 * * *"   # 12Z run (only used if 12Z models exist)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ecmwf-mos
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run MOS
        env:
          PYTHONWARNINGS: ignore
        run: >
          python ecmwf_mos.py --source google --data-dir work predict
          --models models/mos_models.json
          --stations XMR TTS MLB
          --html docs/index.html

      - name: Commit bulletin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No new run."
          else
            git commit -m "ECMWF MOS $(cat docs/run.txt)"
            git push
          fi
